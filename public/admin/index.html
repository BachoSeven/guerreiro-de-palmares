<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://app.pagescms.org/BachoSeven/guerreiro-de-palmares/main" />
    <title>Editor del sito — Guerreiro de Palmares</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f6f2eb;
        color: #2c2a27;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }
      p {
        line-height: 1.55;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: #b45309;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 1.5rem;
        color: #6b6560;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Editor del sito</h1>
      <p>
        Stai per essere reindirizzato a <strong>Pages CMS</strong>, l'editor
        usato per modificare pagine, post e immagini.
      </p>
      <p>
        <a class="button" href="https://app.pagescms.org/BachoSeven/guerreiro-de-palmares/main">
          Apri l'editor
        </a>
      </p>
      <small>
        Se non hai ancora un accesso, chiedi un invito a chi gestisce il sito.
        Non serve un account GitHub per collaborare.
      </small>
    </main>
  </body>
</html>
